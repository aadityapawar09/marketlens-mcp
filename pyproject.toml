[project]
name = "marketlens-mcp"
version = "0.1.0"
description = "A beginner-friendly MCP server for stock context and thesis tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.28,<2",
    "yfinance>=0.2.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marketlens_mcp"]
